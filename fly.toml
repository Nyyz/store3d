app = "store3d-app"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  DEBUG = "False"
  # SECRET_KEY потрібно буде задати через `fly secrets set SECRET_KEY="..."`

[mounts]
  source = "sqlite_data"
  destination = "/app/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]
