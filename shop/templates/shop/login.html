{% extends "shop/base.html" %}

{% block title %}Вхід — Store3D{% endblock %}

{% block content %}
<section class="auth-page">
    <div class="auth-card">
        <div class="auth-card__icon">🔐</div>
        <h1 class="auth-card__title" data-i18n="login.title">Вхід в акаунт</h1>
        <p class="auth-card__subtitle" data-i18n="login.subtitle">З поверненням! Увійдіть, щоб продовжити</p>

        <form method="post" action="{% url 'shop:login' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}">
            {% csrf_token %}

            <div class="form-group">
                <label class="form-group__label" for="id_email" data-i18n="login.email">Email</label>
                <input type="email" name="email" id="id_email" class="form-group__input"
                       placeholder="your@email.com" value="{{ email|default:'' }}" required>
            </div>

            <div class="form-group">
                <label class="form-group__label" for="id_password" data-i18n="login.password">Пароль</label>
                <input type="password" name="password" id="id_password" class="form-group__input"
                       placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn--primary btn--lg auth-card__submit" data-i18n="login.submit">
                Увійти
            </button>
        </form>

        <p class="auth-card__footer">
            <span data-i18n="login.noaccount">Ще немає акаунту?</span> <a href="{% url 'shop:register' %}" data-i18n="login.signup">Зареєструватися</a>
        </p>
    </div>
</section>
{% endblock %}
