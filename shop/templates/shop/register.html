{% extends "shop/base.html" %}

{% block title %}Реєстрація — Store3D{% endblock %}

{% block content %}
<section class="auth-page">
    <div class="auth-card">
        <div class="auth-card__icon">✨</div>
        <h1 class="auth-card__title" data-i18n="register.title">Створити акаунт</h1>
        <p class="auth-card__subtitle" data-i18n="register.subtitle">Приєднуйтесь до спільноти колекціонерів</p>

        <form method="post" action="{% url 'shop:register' %}">
            {% csrf_token %}

            <div class="form-group">
                <label class="form-group__label" for="id_email">Email *</label>
                <input type="email" name="email" id="id_email" class="form-group__input"
                       placeholder="your@email.com" value="{{ email|default:'' }}" required>
            </div>

            <div class="form-group">
                <label class="form-group__label" for="id_first_name" data-i18n="register.name">Ім'я</label>
                <input type="text" name="first_name" id="id_first_name" class="form-group__input"
                       placeholder="Ваше ім'я" value="{{ first_name|default:'' }}">
            </div>

            <div class="form-group">
                <label class="form-group__label" for="id_country" data-i18n="register.country">Країна</label>
                <select name="country" id="id_country" class="form-group__select">
                    <option value="UA" {% if country == 'UA' or not country %}selected{% endif %}>🇺🇦 Україна</option>
                    <option value="PL" {% if country == 'PL' %}selected{% endif %}>🇵🇱 Польща</option>
                    <option value="DE" {% if country == 'DE' %}selected{% endif %}>🇩🇪 Німеччина</option>
                    <option value="US" {% if country == 'US' %}selected{% endif %}>🇺🇸 США</option>
                    <option value="GB" {% if country == 'GB' %}selected{% endif %}>🇬🇧 Великобританія</option>
                    <option value="FR" {% if country == 'FR' %}selected{% endif %}>🇫🇷 Франція</option>
                    <option value="IT" {% if country == 'IT' %}selected{% endif %}>🇮🇹 Італія</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-group__label" for="id_password" data-i18n="register.password">Пароль * (мін. 8 символів)</label>
                <input type="password" name="password" id="id_password" class="form-group__input"
                       placeholder="••••••••" required minlength="8">
            </div>

            <div class="form-group">
                <label class="form-group__label" for="id_password_confirm" data-i18n="register.confirm">Підтвердження паролю *</label>
                <input type="password" name="password_confirm" id="id_password_confirm" class="form-group__input"
                       placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn--primary btn--lg auth-card__submit" data-i18n="register.submit">
                Зареєструватися
            </button>
        </form>

        <p class="auth-card__footer">
            <span data-i18n="register.hasaccount">Вже маєте акаунт?</span> <a href="{% url 'shop:login' %}" data-i18n="register.login">Увійти</a>
        </p>
    </div>
</section>
{% endblock %}
